name: Deploy to AWS (Serverless S3, CloudFront & Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'production-deploy'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Deploy Backend API to AWS Lambda (Serverless)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        id: aws-auth
        env:
          SECRET_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "=== Checking AWS Credentials Configuration ==="
          KEY_ID="${SECRET_KEY_ID:-${{ vars.AWS_ACCESS_KEY_ID }}}"
          SEC_KEY="${SECRET_KEY:-${{ vars.AWS_SECRET_ACCESS_KEY }}}"
          
          # Auto-detect region from NEXT_PUBLIC_API_URL if AWS_REGION is unset
          API_URL="${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}"
          if [ -n "${{ vars.AWS_REGION || secrets.AWS_REGION }}" ]; then
            REGION="${{ vars.AWS_REGION || secrets.AWS_REGION }}"
          elif [[ "$API_URL" =~ lambda-url\.([a-z0-9-]+)\.on\.aws ]]; then
            REGION="${BASH_REMATCH[1]}"
            echo "Auto-detected AWS region from NEXT_PUBLIC_API_URL: $REGION"
          else
            REGION="ap-south-1"
          fi

          if [ -z "$KEY_ID" ] || [ -z "$SEC_KEY" ]; then
            echo "::error::AWS credentials not found! Please ensure AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are added to GitHub (Repository Settings -> Secrets and variables -> Actions -> Secrets)."
            echo "Status: AWS_ACCESS_KEY_ID is $([ -n "$KEY_ID" ] && echo 'PRESENT' || echo 'MISSING')"
            echo "Status: AWS_SECRET_ACCESS_KEY is $([ -n "$SEC_KEY" ] && echo 'PRESENT' || echo 'MISSING')"
            exit 1
          fi

          echo "Configuring AWS credentials..."
          aws configure set aws_access_key_id "$KEY_ID"
          aws configure set aws_secret_access_key "$SEC_KEY"
          aws configure set default.region "$REGION"
          echo "AWS credentials configured successfully for region $REGION."

      - name: Package Backend Code & Dependencies
        working-directory: ./backend
        run: |
          echo "Installing Lambda dependencies..."
          python -m pip install --upgrade pip
          pip install --target ./lambda_pkg mangum fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite pypdf httpx python-multipart python-dotenv
          
          echo "Building Lambda bundle..."
          cd lambda_pkg
          zip -r ../lambda-bundle.zip . -x "*__pycache__*" "*.dist-info/*"
          cd ..
          zip -g -r lambda-bundle.zip lambda_handler.py lambda_function.py app data -x "*__pycache__*"
          ls -lh lambda-bundle.zip

      - name: Update Lambda Function Code
        working-directory: ./backend
        run: |
          FUNCTION_NAME="${{ vars.AWS_LAMBDA_FUNCTION_NAME || secrets.AWS_LAMBDA_FUNCTION_NAME || 'jfll-rate-api' }}"
          echo "Deploying to Lambda Function: $FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda-bundle.zip

          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated --function-name "$FUNCTION_NAME" || sleep 5

      - name: Update Lambda Function Configuration
        continue-on-error: true
        working-directory: ./backend
        run: |
          FUNCTION_NAME="${{ vars.AWS_LAMBDA_FUNCTION_NAME || secrets.AWS_LAMBDA_FUNCTION_NAME || 'jfll-rate-api' }}"
          echo "Optimizing Lambda configuration (timeout=30s, memory=512MB, handler=lambda_handler.handler)..."
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --timeout 30 \
            --memory-size 512 \
            --handler "lambda_handler.handler" || echo "Note: Check Lambda configuration in AWS Console if needed."

          echo "Waiting for configuration update to settle..."
          aws lambda wait function-updated --function-name "$FUNCTION_NAME" || sleep 3

      - name: Configure Lambda Function URL CORS
        continue-on-error: true
        working-directory: ./backend
        run: |
          FUNCTION_NAME="${{ vars.AWS_LAMBDA_FUNCTION_NAME || secrets.AWS_LAMBDA_FUNCTION_NAME || 'jfll-rate-api' }}"
          echo "Updating Function URL CORS configuration for $FUNCTION_NAME..."
          aws lambda update-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --cors 'AllowOrigins=["*"],AllowMethods=["GET","POST","PUT","DELETE","OPTIONS"],AllowHeaders=["*"],MaxAge=86400' || echo "Note: Check Function URL CORS in AWS Console if needed."

      - name: Verify Lambda Health via Invocation
        continue-on-error: true
        working-directory: ./backend
        run: |
          FUNCTION_NAME="${{ vars.AWS_LAMBDA_FUNCTION_NAME || secrets.AWS_LAMBDA_FUNCTION_NAME || 'jfll-rate-api' }}"
          echo "=== Testing Lambda Health Check Invocation ==="
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{"version":"2.0","rawPath":"/api/v1/health","requestContext":{"http":{"method":"GET","path":"/api/v1/health"}}}' \
            test_response.json \
            --log-type Tail \
            --query "LogResult" --output text | base64 -d || true
          echo "Lambda Response:"
          cat test_response.json || true

  # =========================================================================
  # JOB 2: Build & Deploy Frontend to S3 + CloudFront
  # =========================================================================
  deploy-frontend:
    name: Build & Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS Credentials
        id: aws-auth
        env:
          SECRET_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          KEY_ID="${SECRET_KEY_ID:-${{ vars.AWS_ACCESS_KEY_ID }}}"
          SEC_KEY="${SECRET_KEY:-${{ vars.AWS_SECRET_ACCESS_KEY }}}"
          
          # Auto-detect region from NEXT_PUBLIC_API_URL if AWS_REGION is unset
          API_URL="${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}"
          if [ -n "${{ vars.AWS_REGION || secrets.AWS_REGION }}" ]; then
            REGION="${{ vars.AWS_REGION || secrets.AWS_REGION }}"
          elif [[ "$API_URL" =~ lambda-url\.([a-z0-9-]+)\.on\.aws ]]; then
            REGION="${BASH_REMATCH[1]}"
          else
            REGION="ap-south-1"
          fi

          if [ -z "$KEY_ID" ] || [ -z "$SEC_KEY" ]; then
            echo "::error::AWS credentials missing."
            exit 1
          fi

          aws configure set aws_access_key_id "$KEY_ID"
          aws configure set aws_secret_access_key "$SEC_KEY"
          aws configure set default.region "$REGION"
          echo "AWS_DEFAULT_REGION=$REGION" >> $GITHUB_ENV
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV
          echo "AWS credentials configured successfully for region $REGION."

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: |
          RAW_URL="${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}"
          CLEAN_URL=$(echo "$RAW_URL" | grep -o -E 'https://[a-zA-Z0-9.-]+\.on\.aws' | head -n 1)
          if [ -z "$CLEAN_URL" ]; then
            CLEAN_URL="$RAW_URL"
          fi
          echo "Sanitized Next.js API URL: $CLEAN_URL"
          NEXT_OUTPUT_EXPORT=true NEXT_PUBLIC_API_URL="$CLEAN_URL" npm run build

      - name: Sync Static Assets to S3
        run: |
          BUCKET_NAME="${{ vars.AWS_S3_BUCKET_NAME || secrets.AWS_S3_BUCKET_NAME || vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}"
          if [ -z "$BUCKET_NAME" ]; then
            echo "::error::S3 Bucket Name is not configured. Please add AWS_S3_BUCKET_NAME (or S3_BUCKET_NAME) in GitHub Secrets."
            exit 1
          fi
          echo "Target S3 Bucket: $BUCKET_NAME in region ${AWS_REGION:-ap-south-1}"
          # Sync immutable hashed JS/CSS assets
          aws s3 sync frontend/out "s3://$BUCKET_NAME" --delete --exclude "*.html" --cache-control "public, max-age=31536000, immutable" --region "${AWS_REGION:-ap-south-1}"
          # Sync HTML and root documents with no-cache so updates are immediately visible
          aws s3 sync frontend/out "s3://$BUCKET_NAME" --delete --include "*.html" --cache-control "no-cache, no-store, must-revalidate" --region "${AWS_REGION:-ap-south-1}"

      - name: Invalidate CloudFront CDN Cache
        run: |
          DIST_ID="${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID || secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront Cache for Distribution: $DIST_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
          else
            echo "CloudFront Distribution ID is not configured, skipping cache invalidation."
          fi
