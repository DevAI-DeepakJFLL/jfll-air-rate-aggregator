name: CD - Deploy to AWS Free Tier

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'anti-slop/**'

jobs:
  deploy-frontend:
    name: Deploy Frontend to S3 & CloudFront
    runs-on: ubuntu-latest
    if: ${{ github.repository != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Static Export
        working-directory: ./frontend
        env:
          NEXT_OUTPUT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Sync Static Files to AWS S3 Bucket
        if: ${{ secrets.S3_BUCKET_NAME != '' }}
        run: |
          aws s3 sync ./frontend/out s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront CDN Cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Backend to AWS Free Tier EC2
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_EC2_HOST != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        env:
          SSH_HOST: ${{ secrets.AWS_EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /opt/rate-aggregator &&
            git pull origin main &&
            cd backend &&
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate &&
            pip install -r requirements.txt &&
            sudo systemctl restart jfll-backend.service
          "
