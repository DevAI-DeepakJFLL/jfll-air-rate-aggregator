name: CD - Deploy to AWS Free Tier (EC2)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-deploy:
    name: Build Containers & Deploy to AWS Free Tier
    needs: []
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL || 'https://rates.jetfreight.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment to AWS Free Tier EC2 (Pull pre-built image to avoid 1GB RAM compile limits)
      - name: Deploy to AWS Free Tier EC2 via SSH
        if: ${{ secrets.AWS_EC2_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.AWS_EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /opt/rate-aggregator &&
            echo \"$REGISTRY_TOKEN\" | docker login ghcr.io -u \"$ACTOR\" --password-stdin &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans &&
            docker image prune -f
          "
