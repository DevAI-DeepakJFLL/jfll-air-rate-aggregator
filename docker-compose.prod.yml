version: '3.8'

# ==============================================================================
# AWS Free Tier Optimized Production Stack (EC2 t3.micro / t4g.small)
# Memory capped to prevent OOM on 1GB RAM instances.
# Next.js standalone (<120MB RAM) + FastAPI (<80MB RAM) + Caddy reverse proxy (<30MB)
# ==============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: jfll_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - frontend
      - backend

  backend:
    image: ghcr.io/devai-deepakjfll/rate-aggregator-backend:latest
    container_name: jfll_rate_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - backend_prod_data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "8000"

  frontend:
    image: ghcr.io/devai-deepakjfll/rate-aggregator-frontend:latest
    container_name: jfll_rate_frontend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "3000"
    depends_on:
      - backend

volumes:
  backend_prod_data:
  caddy_data:
  caddy_config:
